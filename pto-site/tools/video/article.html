<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>X-PTO — ролик по статье</title>
<!--
  Ролики по статьям: 1080×1920, ~60–70 секунд, без голоса — всё понятно по тексту.

  Одна страница на все статьи: сцены каждого ролика лежат в tools/video/articles/<адрес>.json,
  страница открывается как article.html?a=<адрес>. Там же длительности сцен и музыка —
  tools/make-article-video.py читает тот же файл, поэтому звук попадает в смены сцен сами.

  Все формулировки берутся из статьи data/articles/<адрес>.md (или, если ролик про услугу,
  из её записи в data/services.json — адрес такого файла начинается с «usluga-»). Цифр, которых
  в источнике нет, в ролике быть не должно: строки акта и сметы в первой сцене нарочно без сумм.
  Телефон и Telegram в финале — из data/site.json, а не написаны здесь.

  Оформление: лист документа на тёмном столе. Листы входят по-разному (снизу, разворотом,
  из глубины), заголовки собираются по словам, у каждой статьи своя анимация первой сцены
  (акт с красной ручкой, стопка документов, печать, кран, съёмка, смета под лупой).
  Нижние ~330 px и правый край в Reels и ВК закрывают кнопки — лист кончается выше.

  Типы сцен: hook, cards, list (num | check), quote, steps, final — описаны в BUILD ниже.
  У листа может быть "dark": true — тёмный лист для одной сцены-признания; "cap" меняет подпись
  над листом (у роликов про услуги — «Услуга · x-pto.ru/uslugi»).
-->
<style>
  @font-face { font-family: "Display"; src: url("../../assets/fonts/geologica-cyrillic.woff2") format("woff2"); font-weight: 300 800; unicode-range: U+0400-04FF; }
  @font-face { font-family: "Display"; src: url("../../assets/fonts/geologica-latin.woff2") format("woff2"); font-weight: 300 800; unicode-range: U+0000-03FF, U+2000-206F; }
  @font-face { font-family: "Text"; src: url("../../assets/fonts/inter-cyrillic.woff2") format("woff2"); font-weight: 300 800; unicode-range: U+0400-04FF; }
  @font-face { font-family: "Text"; src: url("../../assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 300 800; unicode-range: U+0000-03FF, U+2000-206F; }
  @font-face { font-family: "Mono"; src: url("../../assets/fonts/mono-cyrillic.woff2") format("woff2"); font-weight: 300 800; unicode-range: U+0400-04FF; }
  @font-face { font-family: "Mono"; src: url("../../assets/fonts/mono-latin.woff2") format("woff2"); font-weight: 300 800; unicode-range: U+0000-03FF, U+2000-206F; }

  :root {
    --desk: #0b1828; --ink: #0d1c30; --paper: #ffffff; --accent: #1f6feb; --accent-300: #7fb0ff;
    --hi: #1f6feb;                       /* цвет статьи: номера, галочки, маркер рамок */
    --muted: #55677e; --line: #dfe5ee; --red: #d93025; --marker: rgba(255, 214, 64, .75); --good: #1a8a4a;
    --pop: cubic-bezier(.34, 1.56, .64, 1);
    --snap: cubic-bezier(.16, 1, .3, 1);
    --io: cubic-bezier(.76, 0, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--desk); }
  body { font-family: "Text", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--desk); }

  /* ---------- стол: живой фон ---------- */
  .glow { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; filter: blur(120px); opacity: .55;
    animation: drift linear both; animation-duration: calc(var(--total) * 1s); }
  .glow.g1 { left: -300px; top: 100px; background: radial-gradient(circle, #1f6feb 0%, rgba(31, 111, 235, 0) 65%); }
  .glow.g2 { right: -420px; top: 900px; background: radial-gradient(circle, var(--hi) 0%, rgba(0, 0, 0, 0) 65%);
    opacity: .4; animation-direction: reverse; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } 50% { transform: translate(220px, -260px) scale(1.15); }
    to { transform: translate(-80px, 180px) scale(.95); } }
  .grid { position: absolute; inset: -60px; background:
      linear-gradient(rgba(127, 176, 255, .07) 1px, transparent 1px) 0 0 / 60px 60px,
      linear-gradient(90deg, rgba(127, 176, 255, .07) 1px, transparent 1px) 0 0 / 60px 60px;
    animation: grid linear both; animation-duration: calc(var(--total) * 1s); }
  @keyframes grid { to { transform: translate(60px, -120px); } }

  .desk-cap { position: absolute; left: 60px; right: 180px; top: 62px; display: flex; justify-content: space-between;
    font: 600 26px/1 "Mono", monospace; letter-spacing: .08em; color: var(--accent-300); text-transform: uppercase; }
  .desk-cap b { color: #fff; font-weight: 700; }
  .count { color: #fff; }
  .count span { display: inline-block; min-width: 1.3em; text-align: right; }
  .progress { position: absolute; left: 60px; top: 110px; width: 840px; height: 6px; border-radius: 3px;
    background: rgba(255, 255, 255, .12); overflow: hidden; }
  .progress i { position: absolute; inset: 0; background: linear-gradient(90deg, var(--accent), var(--hi));
    transform-origin: 0 50%; animation: progress linear both; animation-duration: calc(var(--total) * 1s); }
  @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .under { position: absolute; left: 60px; top: 170px; width: 840px; height: 1410px; border-radius: 14px;
    background: #e9eef5; box-shadow: 0 30px 60px rgba(0, 0, 0, .35); }
  .under.u1 { transform: rotate(2.2deg) translate(10px, 14px); background: #c4cfdc; }
  .under.u2 { transform: rotate(-1.4deg) translate(-6px, 8px); background: #dbe3ed; }

  /* ---------- листы: три способа войти ---------- */
  .stack { position: absolute; inset: 0; perspective: 2400px; }
  .sheet { position: absolute; left: 60px; top: 170px; width: 840px; height: 1410px; border-radius: 14px;
    background: var(--paper); padding: 56px 64px 0; overflow: hidden;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .04), 0 40px 80px rgba(0, 0, 0, .45);
    transform: rotate(var(--rot, 0deg)); transform-origin: 50% 50%;
    animation: var(--in) 1s var(--snap) both, sheet-out .8s var(--io) forwards;
    animation-delay: calc(var(--t0) * 1s), calc(var(--t1) * 1s); }
  .sheet.first { animation: sheet-out .8s var(--io) forwards; animation-delay: calc(var(--t1) * 1s); }
  .sheet.gone { visibility: hidden; }
  .sheet::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: linear-gradient(90deg, var(--accent), var(--hi)); }
  @keyframes in-rise { from { transform: translateY(1900px) rotate(9deg); } to { transform: rotate(var(--rot, 0deg)); } }
  @keyframes in-turn { from { transform: translateX(1100px) rotateY(-70deg) rotate(4deg); filter: brightness(.6); }
    to { transform: rotate(var(--rot, 0deg)); filter: none; } }
  @keyframes in-deep { from { transform: translateY(120px) scale(.55) rotate(-6deg); opacity: 0; filter: blur(14px); }
    to { transform: rotate(var(--rot, 0deg)); opacity: 1; filter: none; } }
  @keyframes sheet-out { from { transform: rotate(var(--rot, 0deg)); }
    to { transform: translate(-60px, -2150px) rotate(-10deg); } }

  .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 20px;
    border-bottom: 2px solid var(--ink); font: 600 24px/1 "Mono", monospace; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); }
  .head b { color: var(--ink); font-weight: 700; }

  h1, h2 { font-family: "Display", sans-serif; font-weight: 800; letter-spacing: -.02em; }
  h1 { font-size: 96px; line-height: 1.02; margin-top: 56px; }
  h2 { font-size: 80px; line-height: 1.05; margin-top: 52px; }
  h1 em, h2 em { font-style: normal; color: var(--hi); }
  h1 em.red, h2 em.red { color: var(--red); }
  .lead { font-size: 44px; line-height: 1.3; color: var(--muted); margin-top: 52px; }
  .lead b { color: var(--ink); }

  /* ---------- анимации элементов: время от входа листа ---------- */
  .a { animation-fill-mode: both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  .a.up { animation: up .75s var(--snap) both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  @keyframes up { from { opacity: 0; transform: translateY(60px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .a.left { animation: left .8s var(--snap) both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  @keyframes left { from { opacity: 0; transform: translateX(-110px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .a.pop { animation: pop .65s var(--pop) both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  @keyframes pop { from { opacity: 0; transform: scale(0) rotate(-30deg); } to { opacity: 1; transform: none; } }
  .a.stamp { animation: stamp .55s var(--pop) both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  @keyframes stamp { from { opacity: 0; transform: scale(2.4) rotate(var(--sr, -8deg)); filter: blur(6px); }
    to { opacity: 1; transform: rotate(var(--sr, -8deg)); filter: none; } }
  .a.fade { animation: fade .6s ease both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .w { display: inline-block; animation: word .7s var(--snap) both;
    animation-delay: calc((var(--t0) + var(--d, 0) + var(--i) * .08) * 1s); }
  @keyframes word { from { opacity: 0; transform: translateY(70%) rotate(4deg); filter: blur(10px); }
    to { opacity: 1; transform: none; filter: none; } }
  mark, .mark { color: inherit; background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 78% / 0% 42%;
    animation: mark .7s var(--io) both; animation-delay: calc((var(--t0) + var(--d, 0)) * 1s);
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  @keyframes mark { to { background-size: 100% 42%; } }
  /* лист, на котором всё сказано, чуть «дышит» — кадр не замирает */
  .breath { animation: breath 6s ease-in-out both; animation-delay: calc((var(--t0) + 1) * 1s); }
  @keyframes breath { from { transform: none; } to { transform: scale(1.025); } }
  .body { transform-origin: 50% 0; }

  /* ---------- крючок: общие детали ---------- */
  .vis { position: relative; margin-top: 56px; height: 470px; }
  .paper-mock { position: absolute; inset: 0; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .bar { position: absolute; height: 14px; border-radius: 7px; background: #cfd8e3; }
  .tag { position: absolute; padding: 10px 22px; border: 5px solid var(--red); border-radius: 10px; --sr: -9deg;
    font: 800 42px/1 "Display", sans-serif; color: var(--red); text-transform: uppercase; background: rgba(255, 255, 255, .92); }
  svg.draw * { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ln { stroke-dasharray: var(--len) var(--len); stroke-dashoffset: var(--len); animation: draw var(--dur, .8s) var(--io) both;
    animation-delay: calc((var(--t0) + var(--d, 0)) * 1s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* акт КС-2 и красная ручка */
  .act { position: relative; margin-top: 64px; border: 2px solid var(--line); border-radius: 8px; height: 432px; }
  .act__top { height: 110px; padding: 22px 28px 0; border-bottom: 2px solid var(--line);
    font: 600 22px/1.35 "Mono", monospace; color: var(--muted); letter-spacing: .04em; }
  .act__top b { display: block; color: var(--ink); font-size: 26px; }
  .row { display: flex; align-items: center; gap: 22px; height: 64px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .n { width: 34px; font: 600 24px/1 "Mono", monospace; color: var(--muted); }
  .row .t { height: 14px; border-radius: 7px; background: #cfd8e3; }
  .row .v { margin-left: auto; width: 110px; height: 14px; border-radius: 7px; background: #b7c3d2; }
  .strike { position: absolute; left: 90px; width: 530px; height: 7px; margin-top: -3px; border-radius: 4px;
    background: var(--red); transform-origin: 0 50%; animation: strike .48s linear both;
    animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  @keyframes strike { from { transform: scaleX(0) rotate(-1.2deg); } to { transform: scaleX(1) rotate(-1.2deg); } }
  .pen { position: absolute; left: 0; top: 0; width: 0; height: 0; animation: pen 2.4s linear both;
    animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  .pen::before { content: ""; position: absolute; left: 0; top: -13px; width: 230px; height: 26px;
    transform-origin: 0 50%; transform: rotate(-38deg); border-radius: 3px 13px 13px 3px;
    background: linear-gradient(90deg, #444 0 16px, #c62a20 16px 150px, #7d1710 150px 160px, #c62a20 160px);
    clip-path: polygon(0 50%, 18px 0, 100% 0, 100% 100%, 18px 100%); }
  @keyframes pen {
    0%   { transform: translate(90px, 206px); opacity: 0; }
    5%   { opacity: 1; }
    20%  { transform: translate(620px, 206px); }
    28%  { transform: translate(90px, 270px); }
    48%  { transform: translate(620px, 270px); }
    56%  { transform: translate(90px, 398px); }
    76%  { transform: translate(620px, 398px); opacity: 1; }
    100% { transform: translate(760px, 300px); opacity: 0; } }

  /* стопка документов */
  .doc { position: absolute; left: 50%; top: 10px; width: 340px; height: 132px; margin-left: -170px; border-radius: 10px;
    background: #fff; border: 2px solid var(--line); box-shadow: 0 16px 30px rgba(13, 28, 48, .16); padding: 20px 60px 0 24px;
    animation: doc-in .7s var(--snap) both; animation-delay: calc((var(--t0) + var(--d)) * 1s);
    transform: translate(var(--x), var(--y)) rotate(var(--r)); }
  .doc b { display: block; font: 800 26px/1.12 "Display", sans-serif; }
  .doc::before { content: ""; position: absolute; right: 18px; top: 18px; width: 30px; height: 30px; border-radius: 50%; background: var(--hi); opacity: .9; }
  .doc i { display: block; height: 10px; border-radius: 5px; background: #dfe5ee; margin-top: 12px; }
  .doc i:nth-of-type(2) { width: 80%; } .doc i:nth-of-type(3) { width: 60%; }
  @keyframes doc-in { from { opacity: 0; transform: translate(var(--x), calc(var(--y) - 700px)) rotate(calc(var(--r) * -3)); }
    to { opacity: 1; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }

  /* печать */
  .seal-big { position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; margin: -165px 0 0 -165px; border-radius: 50%;
    border: 10px solid var(--red); color: var(--red); display: grid; place-items: center; text-align: center; --sr: -12deg;
    font: 800 88px/1 "Display", sans-serif; background: rgba(255, 255, 255, .55); }
  .seal-big::before { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 3px solid var(--red); }
  .seal-big small { display: block; font: 700 22px/1.2 "Mono", monospace; letter-spacing: .06em; margin-top: 8px; }
  .shake { animation: shake .45s linear both; animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-10px, 6px); } 40% { transform: translate(8px, -6px); }
    60% { transform: translate(-6px, 3px); } 80% { transform: translate(3px, -2px); } }

  /* кран */
  .zone { opacity: 0; transform-box: view-box; transform-origin: 200px 450px; animation: zone .9s var(--snap) both;
    animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  @keyframes zone { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
  .hook-load { animation: load 2.2s var(--io) both; animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  @keyframes load { from { transform: translateY(-160px); } to { transform: none; } }

  /* съёмка */
  .cross { position: absolute; left: 0; top: 0; width: 0; height: 0; animation: cross 3s var(--io) both;
    animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  .cross::before, .cross::after { content: ""; position: absolute; background: var(--red); }
  .cross::before { left: -40px; top: -2px; width: 80px; height: 4px; }
  .cross::after { left: -2px; top: -40px; width: 4px; height: 80px; }
  .cross i { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border: 4px solid var(--red); border-radius: 50%; }
  @keyframes cross { 0% { transform: translate(120px, 90px); opacity: 0; } 8% { opacity: 1; }
    25% { transform: translate(120px, 90px); } 45% { transform: translate(600px, 110px); }
    65% { transform: translate(590px, 380px); } 85% { transform: translate(140px, 360px); opacity: 1; } 100% { transform: translate(140px, 360px); opacity: 0; } }
  .pt { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--red);
    box-shadow: 0 0 0 8px rgba(217, 48, 37, .18); }
  .legend { position: absolute; left: 24px; bottom: 20px; display: flex; gap: 30px; font: 600 26px/1 "Mono", monospace; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 36px; height: 0; border-top: 5px dashed var(--accent); margin-right: 12px; vertical-align: middle; }
  .legend span.f::before { border-top: 5px solid var(--red); }

  /* прибор: стрелка уходит вправо, перелетает и успокаивается */
  .needle { transform-box: view-box; transform-origin: 356px 330px; animation: needle 1.8s var(--io) both;
    animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  @keyframes needle { 0% { transform: rotate(-82deg); } 45% { transform: rotate(70deg); } 62% { transform: rotate(38deg); }
    78% { transform: rotate(56deg); } 90% { transform: rotate(46deg); } 100% { transform: rotate(50deg); } }
  .meter-cap { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font: 700 30px/1 "Mono", monospace;
    letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

  /* сети */
  .net-cap { position: absolute; left: 230px; font: 700 30px/1 "Mono", monospace; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink); }
  /* стройка → документы */
  .side { position: absolute; left: 0; top: 70px; width: 262px; height: 320px; border: 2px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #fff; }
  .side.right { left: auto; right: 0; }
  .side b { font: 800 34px/1 "Display", sans-serif; }
  .sheets { position: relative; width: 150px; height: 170px; }
  .sheets i { position: absolute; width: 120px; height: 150px; border-radius: 8px; border: 3px solid var(--ink); background: #fff;
    background-image: linear-gradient(#cfd8e3 0 0), linear-gradient(#cfd8e3 0 0), linear-gradient(#cfd8e3 0 0);
    background-size: 70px 8px, 80px 8px, 50px 8px; background-repeat: no-repeat; background-position: 18px 30px, 18px 56px, 18px 82px; }
  .sheets i:nth-child(1) { left: 0; top: 16px; transform: rotate(-8deg); }
  .sheets i:nth-child(2) { left: 16px; top: 8px; transform: rotate(4deg); }
  .sheets i:nth-child(3) { left: 30px; top: 0; border-color: var(--hi); }
  .flow { position: absolute; left: 262px; top: 220px; width: 20px; height: 20px; border-radius: 50%; background: var(--hi);
    animation: flow 1.1s linear 3 both; }
  @keyframes flow { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(170px); opacity: 0; } }

  /* смета под лупой */
  .lens { position: absolute; left: 0; top: 0; width: 170px; height: 170px; animation: lens 3.2s var(--io) both;
    animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  .lens::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 12px solid var(--ink);
    background: rgba(127, 176, 255, .18); box-shadow: 0 16px 30px rgba(0, 0, 0, .2); }
  .lens::after { content: ""; position: absolute; right: -58px; bottom: -40px; width: 90px; height: 26px; border-radius: 13px;
    background: var(--ink); transform: rotate(45deg); }
  @keyframes lens { 0% { transform: translate(520px, 80px); opacity: 0; } 10% { opacity: 1; } 35% { transform: translate(420px, 120px); }
    60% { transform: translate(470px, 250px); } 90% { transform: translate(560px, 300px); opacity: 1; } 100% { transform: translate(620px, 330px); opacity: 0; } }
  .ring { position: absolute; height: 60px; border: 5px solid var(--red); border-radius: 30px; transform-origin: 0 50%;
    animation: ring .45s var(--snap) both; animation-delay: calc((var(--t0) + var(--d)) * 1s); }
  @keyframes ring { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

  /* ---------- карточки ---------- */
  .form { display: grid; grid-template-columns: 160px 1fr; gap: 26px; align-items: start; margin-top: 34px;
    padding: 28px 28px 30px; border: 2px solid var(--line); border-radius: 14px; }
  .form.wide { grid-template-columns: 1fr; gap: 10px; }
  .form.wide .form__code { font-size: 54px; }
  .form__code { font: 800 64px/1.1 "Display", sans-serif; color: var(--hi); letter-spacing: -.02em; }
  .form__name { font: 700 44px/1.18 "Display", sans-serif; }
  .form__what { font-size: 36px; line-height: 1.3; color: var(--muted); margin-top: 12px; }
  .law { display: flex; gap: 24px; align-items: center; margin-top: 36px; padding: 26px 30px;

      var rail = d(el('span', 'rail'), 1.4); rail.style.setProperty('--rail', r2((n - 1) * step + .4));
      ol.appendChild(rail);
      s.items.forEach(function (it, i) {
        var at = 1.3 + i * step;
        var li = el('li', s.lastRed && i === n - 1 ? 'last-red' : '');
        li.appendChild(d(el('span', 'num a pop', String(i + 1)), at));
        li.appendChild(d(el('span', 'txt a left', '<b>' + it.b + '</b>' + (it.t || '') +
          (it.warn ? '<span class="warn">' + it.warn + '</span>' : '')), at + .1));
        ol.appendChild(li);
      });
      body.appendChild(ol);
    },
    final: function (s, body, sheet, C) {
      sheet.classList.add('final');
      title(body, s.title, 'h2', .5);
      var svc = el('div', 'svc');
      s.chips.forEach(function (c, i) { svc.appendChild(d(el('span', 'a pop', c), 1.3 + i * .2)); });
      body.appendChild(svc);
      var brand = d(el('div', 'brand a up', '<img src="../../assets/img/logo.svg" alt=""><div><div class="nm">X-PTO</div><div class="url">x-pto.ru</div></div>'), 2.6);
      // печать — в строке со знаком: её место не зависит от того, в сколько строк лёг заголовок
      if (s.stamp) brand.appendChild(d(el('span', 'seal a stamp', s.stamp), 2.2));
      body.appendChild(brand);
      body.appendChild(d(el('div', 'contacts a up', '<div class="m">' + C.phone_display + '</div><div>Telegram <span class="m">' + C.telegram_display + '</span></div>'), 3.1));
      body.appendChild(d(el('div', 'readmore a up', s.readmore || 'Полная статья — на сайте, <em>раздел «Статьи»</em>'), 3.6));
    }
  };

  var INS = ['in-rise', 'in-turn', 'in-deep'];
  var ROT = [-.6, .7, -.8, .6, -.5, .8, -.7, 0, .5, -.4];

  window.READY = Promise.all([
    fetch('articles/' + slug + '.json').then(function (r) { return r.json(); }),
    fetch('../../data/site.json').then(function (r) { return r.json(); })
  ]).then(function (res) {
    var V = res[0], C = res[1].contacts;
    document.title = 'X-PTO — ролик: ' + V.tag;
    if (V.accent) document.documentElement.style.setProperty('--hi', V.accent);
    if (V.cap) document.getElementById('cap').innerHTML = V.cap;
    var stack = document.getElementById('stack');
    var total = V.scenes.reduce(function (a, s) { return a + s.dur; }, 0);
    document.documentElement.style.setProperty('--total', total);

    var t = 0, sheets = [];
    V.scenes.forEach(function (s, i) {
      var last = i === V.scenes.length - 1;
      var sheet = el('section', 'sheet' + (i === 0 ? ' first' : ''));
      var t1 = last ? 999 : t + s.dur - .15;
      sheet.style.setProperty('--t0', t.toFixed(3));
      sheet.style.setProperty('--t1', t1.toFixed(3));
      sheet.style.setProperty('--rot', (s.type === 'final' ? 0 : ROT[i % ROT.length]) + 'deg');
      sheet.style.setProperty('--in', INS[(i - 1 + INS.length) % INS.length]);
      sheet.dataset.t1 = t1; sheet.dataset.t0 = t;
      if (s.tag) sheet.dataset.tag = s.tag;
      if (s.dark) sheet.classList.add('dark');
      head(sheet, V, i + 1);
      var body = el('div', 'body' + (s.type === 'hook' || s.type === 'final' ? '' : ' breath'));
      sheet.appendChild(body);
      BUILD[s.type](s, body, sheet, C);
      stack.appendChild(sheet);
      sheets.push(sheet);
      t += s.dur;
    });

    var count = document.getElementById('count');
    var n = sheets.length, pad = function (x) { return (x < 10 ? '0' : '') + x; };
    window.tick = function (t) {
      var cur = 0;
      sheets.forEach(function (sh, i) {
        sh.classList.toggle('gone', t > +sh.dataset.t1 + 1);
        if (t >= +sh.dataset.t0) cur = i;
      });
      count.innerHTML = '<span>' + pad(cur + 1) + '</span> / ' + pad(n);
    };
    window.tick(0);
    window.VIDEO_TOTAL = total;
  });

  window.seek = function (t) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t * 1000; });
    if (window.tick) window.tick(t);
  };
  if (!/[?&]capture/.test(location.search)) {
    window.READY.then(function () {
      var start = performance.now();
      (function loop() {
        window.tick((performance.now() - start) / 1000); requestAnimationFrame(loop);
      })();
    });
  }
})();
</script>
</body>
