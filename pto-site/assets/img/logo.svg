<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Логотип">
  <!-- Стопка документов: нижние слои -->
  <rect x="9" y="32" width="30" height="7" rx="2" fill="#24466e"/>
  <rect x="7" y="25" width="34" height="8" rx="2" fill="#16304f"/>
  <!-- Верхний лист -->
  <rect x="5" y="7" width="34" height="21" rx="2.5" fill="#ffffff" stroke="#0e1e33" stroke-width="2"/>
  <!-- Строки текста на листе -->
  <rect x="10" y="12" width="19" height="2" rx="1" fill="#0e1e33"/>
  <rect x="10" y="17" width="24" height="2" rx="1" fill="#c3cfdd"/>
  <rect x="10" y="22" width="14" height="2" rx="1" fill="#c3cfdd"/>
  <!-- Акцент: отметка проверки -->
  <path d="M33.5 34.5l3 3 6-6.5" fill="none" stroke="#1f6feb" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
