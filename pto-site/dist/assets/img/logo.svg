<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="X-PTO">
  <!--
    Знак X-PTO: монограмма из двух контурных штрихов.
    Нижний левый луч — акцентный синий, остальное — цвет текста.

    Тёмные лучи закрашены currentColor: знак берёт цвет от родителя,
    поэтому одинаково читается и на светлом фоне, и на тёмном (подвал,
    тёмная тема). Файл вставляется в страницу целиком генератором,
    иначе currentColor не работает.

    Порядок фигур важен: луч «\» рисуется последним и проходит поверх
    остальных — как в оригинальном знаке.
  -->

  <!-- Луч «/» : нижняя левая половина, акцентная -->
  <path fill="#1f6feb" fill-rule="evenodd"
        d="M27 32 H37 L16 56 H6 Z M30 32 H34 L17.375 51 H13.375 Z"/>

  <!-- Луч «/» : верхняя правая половина -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M48 8 H58 L37 32 H27 Z M46.625 13 H50.625 L34 32 H30 Z"/>

  <!-- Луч «\» : цельный, поверх остальных -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M6 8 H16 L58 56 H48 Z M13.375 13 H17.375 L50.625 51 H46.625 Z"/>
</svg>
