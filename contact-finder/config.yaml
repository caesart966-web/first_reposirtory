# Веса скоринга достоверности (ТЗ, п. 6)
scoring:
  level_a: 40              # источник уровня A (официальный реестр)
  verified_site: 30        # контакт с домена, подтверждённого по ИНН
  multi_source: 15         # контакт в 2+ независимых источниках
  corp_domain: 10          # домен почты совпадает с сайтом компании
  level_d_unverified: -20  # уровень D без верификации
  liquidated: -30          # компания ликвидирована
  base_b_unverified: 15    # контакт с сайта-кандидата (не подтверждён)
  base_c: 20               # источник уровня C (агрегатор с официальным API)

output:
  logs_dir: "logs"
