<!doctype html>
<html lang="ru">

    <!-- TODO: замените example.com на реальный домен сайта -->
    <link rel="canonical" href="https://example.com/uslugi/vstuplenie-v-sro/" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="ООО «БИЗНЕС-ГРУПП» · Вступление в СРО" />

    <!-- Картинка карточки в мессенджерах и соцсетях. Одна на все страницы:
         собрана из знака и имени компании, а не из фотографии — карточка
         показывается размером с ноготь, и кадр в ней превращается в кашу.
         Пересобирается: node scripts/build-og.mjs -->
    <meta property="og:image" content="https://example.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ООО «БИЗНЕС-ГРУПП» — вступление в СРО" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Без JS reveal-блоки остались бы прозрачными: страница выглядела бы пустой -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- data-service — какую услугу показывать, data-root — глубина страницы
         относительно корня сайта (две папки). Второе нужно рукописным путям:
         картинкам из public/ и ссылкам на секции главной. -->
    <div id="root" data-service="vstuplenie" data-root="../../"></div>
    <script type="module" src="/src/service.tsx"></script>
  </body>
</html>
