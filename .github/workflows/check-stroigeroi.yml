# Проверки макета «Строй-Герой». Запускаются на каждую правку в stroigeroi-site/.
#
# Зачем: build.mjs и test.mjs лежали в репозитории, но не запускались нигде,
# кроме как руками у разработчика. Публикация при этом просто копирует папку
# на GitHub Pages без единой проверки — сломанная вёрстка уехала бы заказчику,
# и узнали бы об этом от него. Теперь сборка краснеет раньше выкладки.
name: Проверки макета «Строй-Герой»

on:
  push:
    paths:
      - 'stroigeroi-site/**'
      - '.github/workflows/check-stroigeroi.yml'
  pull_request:
    paths:
      - 'stroigeroi-site/**'
  workflow_dispatch:

jobs:
  check:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stroigeroi-site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Сборщик ничего не пишет, только сверяет: совпадают ли отпечатки
      # style.css и app.js со ссылками в страницах и не разъехалось ли
      # превью с обычными страницами. Заодно ловит ссылки в никуда,
      # пропавшие файлы, картинки без alt и повторяющиеся id.
      - name: Сборка не устарела, ссылки и файлы на месте
        run: node build.mjs --check

      - name: Поставить браузер и набор проверок доступности
        run: |
          npm install playwright@1.49.1 axe-core@4.13.0 --no-save --silent
          npx playwright install --with-deps chromium

      # Пятнадцать страниц на восьми ширинах в обеих темах: ошибки консоли,
      # горизонтальная прокрутка, контраст по WCAG, готовые проверки axe,
      # цели нажатия, видимость пунктира пустых мест, счёт калькулятора
      # и его формат чисел, раскладка карточки по ширине контейнера,
      # сквозной проход покупки кликами и поиск по разделам.
      - name: Проверки в браузере
        run: node test.mjs

      # Навигация по страницам в той разметке, в какой её отдаёт живой сайт:
      # не OpenCart, а доставшийся от прежней темы stroyhero pagination.php.
      # Наши стили ждали разметку движка, и на сайте вышла стрелка
      # на полстраницы — svg без размеров браузер рисует в 300 на 150.
      - name: Навигация по страницам в разметке живого сайта
        run: node tools/test-pagination.mjs

      # Тема OpenCart. Ошибки здесь молчаливые: незакрытый {% for %} валит
      # страницу целиком, а ссылка вида catalog.html в теме ведёт в никуда,
      # и браузер об этом не сообщает.
      - name: Шаблоны темы
        run: python3 tools/twigcheck.py opencart-theme

      # twigcheck.py читает шаблоны снаружи и выражений не разбирает:
      # строка вроде {% set ok = x matches '/^\d+$/' %} для него просто
      # текст, а на сайте такая строка валит страницу белым экраном.
      # Поэтому шаблоны ещё и собираются настоящим Twig — тем же,
      # на котором работает OpenCart. Заодно страница товара строится
      # с двенадцатью форматами цены и остатка: цену движок отдаёт
      # готовой строкой, а поисковику в разметке нужно число, и цифры
      # в разметке обязаны совпасть с ценой на странице.
      - name: Шаблоны собираются настоящим Twig
        run: |
          mkdir -p "$RUNNER_TEMP/twig"
          printf '{"require":{"twig/twig":"^1.42"}}' > "$RUNNER_TEMP/twig/composer.json"
          composer --working-dir="$RUNNER_TEMP/twig" install --no-interaction --quiet
          TWIG_AUTOLOAD="$RUNNER_TEMP/twig/vendor/autoload.php" php tools/render-check.php opencart-theme

      # Названия из 1С бывают с кусками по 37 знаков без пробела
      # («HTR0001,140x80x38мм,-32+350С,точность») или одним словом капсом
      # («ЭЛЕКТРОИНСТРУМЕНТЫ»). Страницы с самыми неудобными из них
      # собираются настоящим Twig и открываются в браузере на шести
      # ширинах: ни один кусок текста не должен вылезать из карточки,
      # строки корзины, плитки или экрана. Заказчик нашёл такое с телефона.
      - name: Длинные названия из 1С не вылезают из рамок
        run: |
          TWIG_AUTOLOAD="$RUNNER_TEMP/twig/vendor/autoload.php" php tools/render-long-names.php "$RUNNER_TEMP/long-names"
          node tools/test-long-names.mjs "$RUNNER_TEMP/long-names"

      # Класс в шаблоне, у которого нет ни одного правила в стилях, - это
      # элемент, который на сайте выглядит как в браузере по умолчанию:
      # так в подвале стояла серая системная кнопка «Заказать звонок»,
      # а пустая корзина и «Заказ принят» были голым текстом.
      - name: У каждого класса в шаблонах есть стили
        run: python3 tools/check-classes.py

      # robots.txt боевого сайта. Ошибку в нём не видно глазами, а цена
      # у неё — магазин в выдаче: популярная строка «Disallow: /index.php?route=»
      # закрыла бы карту сайта этим же файлом, а до включения коротких
      # адресов — весь сайт. Правила прогоняются по 33 адресам с живого сайта.
      - name: robots.txt не закрывает нужное
        run: python3 tools/check-robots.py

      # Команда из УСТАНОВКА.md правит .htaccess боевого сайта, а ошибка
      # в .htaccess роняет его целиком. Откат при ответе не 200 и остановка
      # без копии — логика на одной строке shell, которую вставляют не
      # читая; здесь она запускается на временной папке и подставном
      # сервере в шести случаях.
      - name: Команда правки .htaccess откатывается при ошибке
        run: python3 tools/check-htaccess.py

      # Переменная, которой у контроллера нет, ошибкой не считается: Twig
      # подставит на её место пустоту и промолчит. Так у нас в шапке
      # оказались пустыми ссылки на сравнение и на товары со скидкой,
      # а в подвале — название магазина. Проверка сверяет шаблоны
      # со списком того, что контроллеры OpenCart кладут в $data.
      - name: Переменные шаблонов существуют
        run: python3 tools/check-vars.py

      # Выгрузка 1С. Код 1 — «ждём от заказчика названия разделов»,
      # это не поломка. Код 2 — собранный SQL не прочитался бы сервером:
      # апостроф в названии товара закрывает строковую скобку посреди
      # фразы, и остаток файла выполняется как команды.
      - name: Выгрузка 1С разбирается, SQL собирается целым
        run: |
          python3 tools/1c-import.py; code=$?
          if [ "$code" -ge 2 ]; then exit "$code"; fi
          if ! git diff --quiet -- 1c; then
            echo '::error::Отчёт и предпросмотр по выгрузке 1С разошлись с tools/1c-import.py.'
            git diff --stat -- 1c
            exit 1
          fi

      # Карточка товара нужна в шести шаблонах и собирается скриптом.
      # Если её поправили руками в одном месте, файлы разойдутся —
      # повторный запуск это покажет изменением в дереве.
      - name: Карточка товара не правилась руками
        run: |
          python3 tools/make-cards.py
          if ! git diff --quiet -- opencart-theme; then
            echo '::error::Шаблоны с карточкой товара разошлись с tools/make-cards.py.'
            echo 'Правьте карточку в скрипте и запускайте его, а не шаблоны по отдельности.'
            git diff --stat -- opencart-theme
            exit 1
          fi

      # Обработчики форм выполняются на хостинге под PHP 7.4.33.
      #
      # Проверка в два приёма. Сначала обычный разбор синтаксиса тем PHP,
      # что стоит на сборочной машине. Потом — поиск конструкций, которые
      # появились ПОСЛЕ 7.4: их новый PHP разберёт молча и без замечаний,
      # а на хостинге файл не выполнится вовсе, и сайт отдаст пустую
      # страницу. Список перечислен явно, а не взят из стороннего экшена:
      # лишняя зависимость краснеет по причинам, к коду отношения
      # не имеющим.
      - name: Обработчики годятся для PHP 7.4
        run: |
          find opencart-theme -name '*.php' -print0 | xargs -0 -r -n1 php -l
          NEW='(\?->|\bmatch[[:space:]]*\(|\breadonly[[:space:]]|:[[:space:]]*never\b|\benum[[:space:]]+[A-Za-z]|\bstr_contains\(|\bstr_starts_with\(|\bstr_ends_with\()'
          if grep -rInE "$NEW" --include='*.php' opencart-theme; then
            echo '::error::В коде есть синтаксис новее PHP 7.4 — на хостинге он не выполнится.'
            exit 1
          fi
          echo 'Конструкций новее PHP 7.4 не найдено.'
