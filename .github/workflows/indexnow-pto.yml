# Робот сайта X-PTO: отправляет страницы в IndexNow — Яндекс и Bing узнают
# о них в тот же день, а не когда сами дойдут по карте сайта.
#
# КОГДА ЗАПУСКАТЬ. После того как архив залит на хостинг и сайт в инкогнито
# показывает новую версию: GitHub → Actions → «X-PTO: отправить страницы
# в IndexNow» → Run workflow. Список по умолчанию — pto-site/indexnow.txt.
#
# Прежде чем отправить, робот проверяет, что на сайте лежит файл ключа и что
# каждый адрес есть в карте сайта на хостинге. Новый архив не залит — робот
# ничего не отправляет и пишет, каких адресов не хватает.
name: 'X-PTO: отправить страницы в IndexNow'

on:
  workflow_dispatch:
    inputs:
      adresa:
        description: 'Только эти адреса, через пробел (например /slovar/ /stati/). Пусто — список из pto-site/indexnow.txt'
        required: false
        default: ''
      vse:
        description: 'Отправить все страницы сайта'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow-pto
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ввод из формы — через переменные окружения, а не подстановкой в команду.
      - name: Отправляем
        working-directory: pto-site
        env:
          ADRESA: ${{ inputs.adresa }}
          VSE: ${{ inputs.vse }}
        run: |
          set -f
          opts=""
          [ "$VSE" = "true" ] && opts="--all"
          python3 tools/indexnow.py $opts $ADRESA
