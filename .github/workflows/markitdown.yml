name: MarkItDown auto-convert

# Any file pushed into inbox/ gets converted to Markdown in converted/.
# Triggered on every branch so uploads via the GitHub web UI always work.
# workflow_dispatch allows manual re-runs and accepts an optional file URL,
# so a conversion can be started for any link without touching the repo.
on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:
    inputs:
      url:
        description: "File URL to fetch and convert (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: markitdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MarkItDown and Tesseract OCR (eng+rus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus
          pip install --quiet "markitdown[all]" pytesseract gdown

      - name: Fetch large files from inbox/links.txt
        run: |
          python3 .claude/skills/markitdown/scripts/fetch.py inbox/links.txt \
            --out /tmp/fetched --state converted/.links_done.json \
            || echo "::warning::Some links failed to download — see log above"

      - name: Fetch URL passed to manual run
        if: ${{ github.event.inputs.url != '' && github.event.inputs.url != null }}
        env:
          FETCH_URL: ${{ github.event.inputs.url }}
        run: |
          python3 .claude/skills/markitdown/scripts/fetch.py \
            --url "$FETCH_URL" \
            --out /tmp/fetched --state converted/.links_done.json \
            || echo "::warning::URL download failed — see log above"

      - name: Convert inbox and fetched files to Markdown
        run: |
          mkdir -p /tmp/fetched
          python3 .claude/skills/markitdown/scripts/convert.py inbox /tmp/fetched \
            --recursive --out converted --force \
            || echo "::warning::Some files failed to convert — see log above"

      - name: Commit converted Markdown
        run: |
          git config user.name "markitdown-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add converted
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Auto-convert inbox files to Markdown"
          git push
