name: 'Публикация на GitHub Pages: «Заказы», «Строй-Герой», сайт ПТО и сайт СРО'

on:
  push:
    branches: [main]
    paths:
      - 'orders-app/**'
      - 'stroigeroi-site/**'
      - 'pto-site/**'
      - 'sro-site/**'
      - '.github/workflows/deploy-orders-app.yml'
  workflow_dispatch: # позволяет запустить сборку руками из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            orders-app/package-lock.json
            sro-site/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build

      # Макет «Строй-Герой» — обычная статика, собирать нечего:
      # кладём папку рядом, он открывается по адресу /stroigeroi/
      - name: Добавляем макет «Строй-Герой»
        run: cp -r ../stroigeroi-site dist/stroigeroi

      # Сайт ПТО собирается генератором на Python и открывается по адресу /pto/.
      # Это ПРЕВЬЮ для показа заказчику: подпапка вместо корня домена
      # и запрет индексации, чтобы демо с тестовым телефоном не попало в поиск.
      # Боевая сборка для своего домена делается без этих флагов.
      - name: Собираем сайт ПТО
        working-directory: pto-site
        run: |
          python3 build.py \
            --base-path /${{ github.event.repository.name }}/pto \
            --base-url https://${{ github.repository_owner }}.github.io \
            --noindex

      - name: Добавляем сайт ПТО
        run: cp -r ../pto-site/dist dist/pto

      # Сайт частного специалиста по СРО — это ПРЕВЬЮ для показа заказчику:
      # подпапка вместо корня домена и запрет индексации, чтобы черновик
      # (ещё не все цены и документы заполнены) не попал в поиск.
      # Боевая сборка для своего домена делается без этих флагов.
      - name: Устанавливаем зависимости сайта СРО
        working-directory: sro-site
        run: npm ci

      # Куда уходят заявки из квиза. Секреты необязательны: без них сборка
      # использует значения по умолчанию из src/lib/lead.ts (Web3Forms).
      # Секреты нужны, когда приём заявок переносится на другой сервис.
      # Без ключа форма заявки на сайте не работает, поэтому проверяем явно.
      # Сборку не роняем: в этом же job собираются другие сайты.
      # Печатаем только длину — само значение в логи не попадает.
      - name: Проверяем ключ приёма заявок
        env:
          VITE_LEAD_ACCESS_KEY: ${{ secrets.VITE_LEAD_ACCESS_KEY }}
        run: |
          if [ -z "$VITE_LEAD_ACCESS_KEY" ]; then
            echo "::warning::VITE_LEAD_ACCESS_KEY не задан — форма заявки на сайте СРО работать не будет"
          else
            echo "Ключ приёма заявок задан, длина: ${#VITE_LEAD_ACCESS_KEY}"
          fi

      - name: Собираем сайт СРО
        working-directory: sro-site
        env:
          VITE_LEAD_ENDPOINT: ${{ secrets.VITE_LEAD_ENDPOINT }}
          VITE_LEAD_ACCESS_KEY: ${{ secrets.VITE_LEAD_ACCESS_KEY }}
        run: |
          npm run build -- --base=/${{ github.event.repository.name }}/sro/
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          sed -i 's/name="robots" content="index, follow"/name="robots" content="noindex, nofollow"/' dist/index.html
          # Ключ подставляется в бандл на этапе сборки — убеждаемся, что он там есть.
          if [ -n "$VITE_LEAD_ACCESS_KEY" ] && grep -qF "$VITE_LEAD_ACCESS_KEY" dist/assets/*.js; then
            echo "Ключ приёма заявок попал в сборку — форма будет отправлять заявки"
          else
            echo "::warning::Ключ приёма заявок не попал в сборку — форма покажет экран ошибки"
          fi

      - name: Добавляем сайт СРО
        run: cp -r ../sro-site/dist dist/sro

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: orders-app/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
