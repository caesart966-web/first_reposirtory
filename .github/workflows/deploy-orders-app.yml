name: 'Публикация на GitHub Pages: «Заказы», «Строй-Герой» и сайт ПТО'

on:
  push:
    branches: [main]
    paths:
      - 'orders-app/**'
      - 'stroigeroi-site/**'
      - 'pto-site/**'
      - '.github/workflows/deploy-orders-app.yml'
  workflow_dispatch: # позволяет запустить сборку руками из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orders-app/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build

      # Макет «Строй-Герой» — обычная статика, собирать нечего:
      # кладём папку рядом, он открывается по адресу /stroigeroi/
      - name: Добавляем макет «Строй-Герой»
        run: cp -r ../stroigeroi-site dist/stroigeroi

      # Сайт ПТО собирается генератором на Python и открывается по адресу /pto/.
      # Это ПРЕВЬЮ для показа заказчику: подпапка вместо корня домена
      # и запрет индексации, чтобы демо с тестовым телефоном не попало в поиск.
      # Боевая сборка для своего домена делается без этих флагов.
      - name: Собираем сайт ПТО
        working-directory: pto-site
        run: |
          python3 build.py \
            --base-path /${{ github.event.repository.name }}/pto \
            --base-url https://${{ github.repository_owner }}.github.io \
            --noindex

      - name: Добавляем сайт ПТО
        run: cp -r ../pto-site/dist dist/pto

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: orders-app/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
