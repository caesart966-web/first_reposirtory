name: 'Публикация на GitHub Pages: «Заказы» и макет «Строй-Герой»'

on:
  push:
    branches: [main]
    paths:
      - 'orders-app/**'
      - 'stroigeroi-site/**'
      - '.github/workflows/deploy-orders-app.yml'
  workflow_dispatch: # позволяет запустить сборку руками из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orders-app/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build

      # Макет «Строй-Герой» — обычная статика, собирать нечего:
      # кладём папку рядом, он открывается по адресу /stroigeroi/
      - name: Добавляем макет «Строй-Герой»
        run: cp -r ../stroigeroi-site dist/stroigeroi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: orders-app/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
