name: Debug probe (temporary)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to probe"
        required: false
        default: "https://cloud.mail.ru/stock/KpVP7aY6vofK7iabX5FPmr8i"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .claude/skills/markitdown/scripts/probe_mailru.py "${{ github.event.inputs.url }}"
