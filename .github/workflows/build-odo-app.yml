name: 'Сборка настольной версии «ОДО-проверка» (Windows .exe)'

on:
  workflow_dispatch: # запустить руками из вкладки Actions
  push:
    branches: ['**']
    paths:
      - 'odo-app/**'
      - '.claude/skills/sro-odo/**'
      - '.github/workflows/build-odo-app.yml'

permissions:
  contents: write # чтобы выложить .exe в раздел Releases

concurrency:
  group: odo-app-build
  cancel-in-progress: true

jobs:
  build:
    name: Сборка .exe на Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r odo-app/requirements.txt pyinstaller pywebview

      - name: Tesseract с русским языком (встраивается в .exe для сканов)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $t = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$t\tesseract.exe")) { Write-Error "tesseract не установился"; exit 1 }
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata" -OutFile "$t\tessdata\rus.traineddata"
          & "$t\tesseract.exe" --list-langs
          echo "ODO_TESS_DIR=$t" >> $env:GITHUB_ENV
          echo "$t" >> $env:GITHUB_PATH

      - name: Тесты движка и приложения
        run: |
          python .claude/skills/sro-odo/scripts/test_assess.py
          python .claude/skills/sro-odo/scripts/test_rules.py
          python -m pytest -q odo-app/tests

      - name: Сборка PyInstaller
        run: pyinstaller --clean --noconfirm odo-app/desktop/odo.spec

      - name: Проверка запуска собранного .exe
        shell: pwsh
        env:
          ODO_SMOKE: '1'
          ODO_DATA_DIR: ${{ runner.temp }}\odo-smoke
        run: |
          New-Item -ItemType Directory -Force -Path $env:ODO_DATA_DIR | Out-Null
          $p = Start-Process -FilePath "dist\ODO-proverka-console.exe" -PassThru -NoNewWindow `
               -RedirectStandardOutput "$env:ODO_DATA_DIR\out.txt" -RedirectStandardError "$env:ODO_DATA_DIR\err.txt"
          $finished = $p.WaitForExit(180000)
          if (-not $finished) { taskkill /F /T /PID $p.Id | Out-Null; Write-Host "::error::exe не завершился за 3 минуты" }
          Write-Host "--- stdout"; Get-Content "$env:ODO_DATA_DIR\out.txt" -ErrorAction SilentlyContinue
          Write-Host "--- stderr"; Get-Content "$env:ODO_DATA_DIR\err.txt" -ErrorAction SilentlyContinue
          Write-Host "--- start-error"; Get-Content "$env:ODO_DATA_DIR\start-error.txt" -ErrorAction SilentlyContinue
          Write-Host "--- server.log"; Get-Content "$env:ODO_DATA_DIR\server.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $finished) { exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "::error::exe завершился с кодом $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$env:ODO_DATA_DIR\smoke.ok")) { Write-Host "::error::сервер внутри .exe не поднялся"; exit 1 }
          Get-Content "$env:ODO_DATA_DIR\smoke.ok"
          if (-not (Test-Path "dist\ODO-proverka-folder\_internal\tesseract\tesseract.exe")) { Write-Host "::error::tesseract не попал в сборку"; exit 1 }
          # оконная версия: тот же код, проверяем, что она тоже завершается
          Remove-Item "$env:ODO_DATA_DIR\smoke.ok"
          $w = Start-Process -FilePath "dist\ODO-proverka.exe" -PassThru
          if (-not $w.WaitForExit(180000)) { taskkill /F /T /PID $w.Id | Out-Null; Write-Host "::error::оконный exe не завершился"; exit 1 }
          if (-not (Test-Path "$env:ODO_DATA_DIR\smoke.ok")) { Get-Content "$env:ODO_DATA_DIR\start-error.txt" -ErrorAction SilentlyContinue; Write-Host "::error::оконный exe не поднял сервер"; exit 1 }
          Write-Host "оконная версия: ok"

      - name: Архив папочной версии
        shell: pwsh
        run: Compress-Archive -Path dist\ODO-proverka-folder\* -DestinationPath dist\ODO-proverka-folder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ODO-proverka-exe
          path: dist/ODO-proverka.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ODO-proverka-folder
          path: dist/ODO-proverka-folder.zip

      - name: Выложить в Releases (odo-app-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: odo-app-latest
          name: 'ОДО-проверка — настольная версия (последняя сборка)'
          body: |
            **ODO-proverka.exe** — один файл, двойной щелчок, ничего устанавливать не нужно.
            Первый запуск занимает несколько секунд: программа распаковывается. Windows может спросить
            «Запустить?» (SmartScreen) — «Подробнее» → «Выполнить в любом случае».
            Данные (база и загруженные договоры) появятся в папке «ОДО-данные» рядом с .exe.

            **ODO-proverka-folder.zip** — то же самое папкой: запускается быстрее, реже пугает антивирус.
            Распакуйте и запустите ODO-proverka.exe внутри.

            **ODO-proverka-console.exe** — та же программа с чёрным окном журнала: если обычная не запускается,
            запустите эту и пришлите текст из окна.

            Сборка из коммита ${{ github.sha }} (ветка ${{ github.ref_name }}).
          files: |
            dist/ODO-proverka.exe
            dist/ODO-proverka-folder.zip
            dist/ODO-proverka-console.exe
